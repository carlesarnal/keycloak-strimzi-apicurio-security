process.roles=broker,controller
node.id=1
controller.quorum.voters=1@kafka:9093
listeners=ADMIN://:9092,CONTROLLER://:9093,OAUTH://:9094
advertised.listeners=ADMIN://kafka:9092,OAUTH://kafka:9094
listener.security.protocol.map=ADMIN:PLAINTEXT,CONTROLLER:PLAINTEXT,OAUTH:SASL_PLAINTEXT
controller.listener.names=CONTROLLER
inter.broker.listener.name=ADMIN
listener.name.oauth.sasl.enabled.mechanisms=OAUTHBEARER
listener.name.oauth.oauthbearer.sasl.server.callback.handler.class=io.strimzi.kafka.oauth.server.JaasServerOauthValidatorCallbackHandler
listener.name.oauth.oauthbearer.sasl.login.callback.handler.class=io.strimzi.kafka.oauth.client.JaasClientOauthLoginCallbackHandler
listener.name.oauth.oauthbearer.sasl.jaas.config=org.apache.kafka.common.security.oauthbearer.OAuthBearerLoginModule required oauth.valid.issuer.uri="http://keycloak:8080/realms/lab" oauth.jwks.endpoint.uri="http://keycloak:8080/realms/lab/protocol/openid-connect/certs" oauth.username.claim="preferred_username" oauth.token.endpoint.uri="http://keycloak:8080/realms/lab/protocol/openid-connect/token" oauth.client.id="publisher" oauth.client.secret="local-lab-publisher";
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:ANONYMOUS
allow.everyone.if.no.acl.found=false
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
log.dirs=/tmp/kraft-lab
